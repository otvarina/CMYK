<script>
(function(){
'use strict';

var CH = ['C','M','Y','K'];
var MAX_SECONDS = 20;
var PREVIEW_SIDE = 720;
var EXPORT_SIDE  = 1024;
var SLIDER_MAX   = 200;

/* ---------- элементы ---------- */
var stage   = document.getElementById('stage');
var dropEl  = document.getElementById('drop');
var fileIn  = document.getElementById('fileInput');
var video   = document.getElementById('src');
var view    = document.getElementById('view');
var viewCtx = view.getContext('2d');
var playBtn = document.getElementById('playBtn');
var seekEl  = document.getElementById('seek');
var timeOut = document.getElementById('timeOut');
var fpsSel  = document.getElementById('fpsSel');
var scopeAll= document.getElementById('scopeAll');
var scopeFr = document.getElementById('scopeFrame');
var frameRow= document.getElementById('frameRow');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var applyBtn= document.getElementById('applyAllBtn');
var frameOut= document.getElementById('frameOut');
var modeBtn = document.getElementById('modeBtn');
var htBtn   = document.getElementById('halftoneBtn');
var dotRow  = document.getElementById('dotRow');
var dotSize = document.getElementById('dotSize');
var dotVal  = document.getElementById('dotVal');
var resetBtn= document.getElementById('resetBtn');
var newBtn  = document.getElementById('newBtn');
var dlBtn   = document.getElementById('dlBtn');

/* ---------- состояние ---------- */
function blank(){ return {C:{x:0,y:0,rot:0,on:true}, M:{x:0,y:0,rot:0,on:true}, Y:{x:0,y:0,rot:0,on:true}, K:{x:0,y:0,rot:0,on:true}}; }
function clone(s){ var o=blank(); CH.forEach(function(k){ o[k].x=s[k].x; o[k].y=s[k].y; o[k].rot=s[k].rot; o[k].on=s[k].on; }); return o; }

var globalS = blank();
var frameMap = {};          // индекс кадра -> настройки
var perFrame = false;
var fpsMode = 'original';   // 'original' | число
var mode = 'multiply';
var halftone = false;
var cells = 147;
var activeCh = 'C';

var duration = 0;
var frameCount = 1;
var curFrame = 0;
var loaded = false;

/* ---------- рабочие буферы ---------- */
var capCanvas = document.createElement('canvas');
var capCtx = capCanvas.getContext('2d', {willReadFrequently:true});
var outImg = null;
var CC = null, MM = null, YY = null, KK = null;
var workW = 0, workH = 0;

/* ---------- таблица растровых точек ----------
   порог = π·r², r нормирован так, что r=1 в углу ячейки.
   доля закрашенной площади тогда точно равна покрытию краской;
   выше 50% точка превращается в «кольцо» инверсией. */
var NT = 120;
var TAB = (function(){
  var t = new Float32Array(NT*NT);
  for (var j=0;j<NT;j++) for (var i=0;i<NT;i++){
    var u=(i+0.5)/NT-0.5, v=(j+0.5)/NT-0.5;
    t[j*NT+i] = Math.min(1, Math.PI*(u*u+v*v));
  }
  return t;
})();

var ANGLES = {C:15, M:75, Y:0, K:45};
var GEO = {};
CH.forEach(function(k){
  var a = ANGLES[k]*Math.PI/180;
  GEO[k] = {ca:Math.cos(a), sa:Math.sin(a)};
});

/* ---------- компоненты по пикселю-источнику ---------- */
function prep(src, n, mul){
  if (!CC || CC.length !== n){
    CC = new Float32Array(n); MM = new Float32Array(n);
    YY = new Float32Array(n); KK = new Float32Array(n);
  }
  for (var i=0;i<n;i++){
    var p = i*4;
    var r = src[p], g = src[p+1], b = src[p+2];
    var kk = mul ? 1 - Math.max(r,g,b)/255 : Math.min(r,g,b)/255;
    KK[i] = kk;
    if (kk >= 0.9999){ CC[i]=0; MM[i]=0; YY[i]=0; continue; }
    var inv = 1 - kk;
    var rf = r/255, gf = g/255, bf = b/255;
    if (mul){
      CC[i] = (1-rf-kk)/inv; MM[i] = (1-gf-kk)/inv; YY[i] = (1-bf-kk)/inv;
    } else {
      CC[i] = (rf-kk)/inv;   MM[i] = (gf-kk)/inv;   YY[i] = (bf-kk)/inv;
    }
  }
}

/* ---------- композит ----------
   каждый канал берёт СВОЙ пиксель источника (сдвиг + поворот),
   затем каналы складываются. multiply: 255·Π(1−e), screen: 255−255·Π(1−e).
   нулевой сдвиг и поворот дают ровно исходную картинку. */
function composite(out, w, h, S, mul, sc){
  var comps = [CC, MM, YY, KK];
  var cx = w/2, cy = h/2;
  var period = Math.max(2.5, Math.max(w,h)/cells);
  var ca=[0,0,0,0], sa=[0,0,0,0], dx=[0,0,0,0], dy=[0,0,0,0], on=[0,0,0,0], gca=[0,0,0,0], gsa=[0,0,0,0];
  for (var i=0;i<4;i++){
    var k = CH[i], st = S[k];
    var a = st.rot*Math.PI/180;
    ca[i]=Math.cos(a); sa[i]=Math.sin(a);
    dx[i]=st.x*sc; dy[i]=st.y*sc; on[i]=st.on?1:0;
    gca[i]=GEO[k].ca; gsa[i]=GEO[k].sa;
  }
  var o = 0;
  for (var y=0;y<h;y++){
    for (var x=0;x<w;x++){
      var eC=0, eM=0, eY=0, eK=0;
      for (var c=0;c<4;c++){
        if (!on[c]) continue;
        var ox = x - cx - dx[c];
        var oy = y - cy - dy[c];
        var sx = ca[c]*ox + sa[c]*oy + cx;
        var sy = -sa[c]*ox + ca[c]*oy + cy;
        if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
        var ui = sx|0, vi = sy|0;
        var comp = comps[c][vi*w + ui];
        var e;
        if (halftone){
          var pu = (ui*gca[c] + vi*gsa[c])/period; pu -= Math.floor(pu);
          var pv = (-ui*gsa[c] + vi*gca[c])/period; pv -= Math.floor(pv);
          var th = TAB[((pv*NT)|0)*NT + ((pu*NT)|0)];
          e = (comp <= 0.5) ? (comp > th ? 1 : 0) : (((1-comp) > th) ? 0 : 1);
        } else {
          e = comp;
        }
        if (c===0) eC=e; else if (c===1) eM=e; else if (c===2) eY=e; else eK=e;
      }
      var fK = 1 - eK;
      var R = 255*(1-eC)*fK;
      var G = 255*(1-eM)*fK;
      var B = 255*(1-eY)*fK;
      if (!mul){ R = 255-R; G = 255-G; B = 255-B; }
      out[o] = R; out[o+1] = G; out[o+2] = B; out[o+3] = 255;
      o += 4;
    }
  }
}

/* ---------- вспомогательное ---------- */
function isIdentity(S){
  if (halftone) return false;
  for (var i=0;i<4;i++){
    var st = S[CH[i]];
    if (!st.on || st.x !== 0 || st.y !== 0 || st.rot !== 0) return false;
  }
  return true;
}

function sizeFor(longSide){
  var vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  var s = longSide / Math.max(vw, vh);
  if (s > 1) s = 1;
  return { w: Math.max(2, Math.round(vw*s)), h: Math.max(2, Math.round(vh*s)) };
}

function ensureTarget(ctx, canvas, w, h){
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    return new ImageData(w, h);
  }
  if (!ctx.__img || ctx.__img.width !== w || ctx.__img.height !== h){
    ctx.__img = new ImageData(w, h);
  }
  return ctx.__img;
}

/* нарисовать кадр: video -> композит -> canvas */
function renderFrameTo(ctx, canvas, w, h, S){
  var img = ensureTarget(ctx, canvas, w, h);
  capCanvas.width = w; capCanvas.height = h;
  capCtx.drawImage(video, 0, 0, w, h);

  if (isIdentity(S)){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,w,h);
    ctx.drawImage(capCanvas, 0, 0);
    return;
  }
  var src = capCtx.getImageData(0,0,w,h).data;
  prep(src, w*h, mode === 'multiply');
  composite(img.data, w, h, S, mode === 'multiply', Math.max(w,h)/1000);
  ctx.putImageData(img, 0, 0);
}

/* ---------- настройки кадра ---------- */
function settingsFor(idx){
  if (perFrame && frameMap[idx]) return frameMap[idx];
  return globalS;
}
function editSettings(idx){
  if (!perFrame) return globalS;
  if (!frameMap[idx]) frameMap[idx] = clone(globalS);
  return frameMap[idx];
}

/* ---------- отрисовка превью ---------- */
var rendering = false;

function drawPreview(){
  if (!loaded || rendering) return;
  rendering = true;
  try {
    var sz = sizeFor(PREVIEW_SIDE);
    renderFrameTo(viewCtx, view, sz.w, sz.h, settingsFor(curFrame));
  } finally { rendering = false; }
}

/* ---------- воспроизведение ---------- */
var playing = false, rafId = null, lastKey = -1;

function tick(){
  if (!playing) return;
  var key;
  if (perFrame){
    var idx = frameIndexAt(video.currentTime);
    key = idx;
    if (idx !== curFrame){ curFrame = idx; updateFrameUI(); }
  } else {
    key = video.currentTime;
  }
  if (key !== lastKey){ lastKey = key; drawPreview(); }
  updateTimeUI();
  rafId = requestAnimationFrame(tick);
}

function frameIndexAt(t){
  if (fpsMode === 'original') return 0;
  var f = parseFloat(fpsMode);
  var i = Math.floor(t*f + 1e-6);
  return Math.max(0, Math.min(frameCount-1, i));
}

function play(){
  if (!loaded) return;
  playing = true; lastKey = -1;
  playBtn.textContent = '❚❚';
  video.play().catch(function(){});
  rafId = requestAnimationFrame(tick);
}
function pause(){
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  playBtn.textContent = '▶';
  video.pause();
  drawPreview();
}
function togglePlay(){ playing ? pause() : play(); }

/* ---------- UI ---------- */
function fmt(t){
  if (!isFinite(t)) t = 0;
  return t.toFixed(1);
}
function updateTimeUI(){
  var d = duration || 0;
  timeOut.textContent = fmt(video.currentTime) + ' / ' + fmt(d);
  if (!seeking) seekEl.value = d ? Math.round(video.currentTime/d*1000) : 0;
}
var seeking = false;

function updateFrameUI(){
  if (!perFrame){ frameRow.style.display = 'none'; return; }
  frameRow.style.display = 'flex';
  frameOut.textContent = 'кадр ' + (curFrame+1) + ' / ' + frameCount;
}

function paintSliders(S){
  CH.forEach(function(k){
    var s = S[k];
    document.querySelector('input[data-ch="'+k+'"][data-axis="x"]').value = s.x;
    document.querySelector('input[data-ch="'+k+'"][data-axis="y"]').value = s.y;
    document.querySelector('input[data-ch="'+k+'"][data-axis="rot"]').value = s.rot;
    document.querySelector('[data-vv="'+k+'-x"]').textContent = Math.round(s.x);
    document.querySelector('[data-vv="'+k+'-y"]').textContent = Math.round(s.y);
    document.querySelector('[data-vv="'+k+'-rot"]').textContent = (Math.round(s.rot*10)/10)+'°';
    var tg = document.querySelector('[data-tg="'+k+'"]');
    tg.classList.toggle('on', s.on);
    tg.setAttribute('aria-pressed', String(!!s.on));
    document.querySelector('.chan[data-ch="'+k+'"]').classList.toggle('off', !s.on);
  });
}

function setActive(k){
  activeCh = k;
  CH.forEach(function(x){
    document.querySelector('.chan[data-ch="'+x+'"]').classList.toggle('active', x===k);
  });
}

/* ---------- пересчёт кадров при смене fps ---------- */
function recomputeFrames(){
  if (!loaded){ frameCount = 1; curFrame = 0; return; }
  if (fpsMode === 'original'){ frameCount = 1; curFrame = 0; return; }
  var f = parseFloat(fpsMode);
  frameCount = Math.max(1, Math.floor(duration*f + 1e-6));
  curFrame = frameIndexAt(video.currentTime);
  updateFrameUI();
}

/* ---------- загрузка видео ---------- */
var prevSrc = '', prevTime = 0, hadVideo = false;

function loadFile(file){
  if (!file || file.type.indexOf('video/') !== 0) return;

  /* запоминаем, что было: если новое видео не подойдёт, вернём прежнее */
  prevSrc  = video.src || '';
  prevTime = video.currentTime || 0;
  hadVideo = loaded;
  var prevDuration = duration;

  function reject(msg){
    if (hadVideo && prevSrc){
      video.src = prevSrc;                       // откат, иначе экспорт пойдёт по чужому файлу
      duration = prevDuration;
      whenFrameReady(function(){
        video.currentTime = prevTime || 0;
        drawPreview();
      });
    } else {
      video.removeAttribute('src');
      video.load();
      loaded = false; started = false;
      dlBtn.disabled = true; playBtn.disabled = true; seekEl.disabled = true;
      viewCtx.clearRect(0,0,view.width,view.height);
      dropEl.classList.remove('hidden');
    }
    toast(msg);
  }

  var url = URL.createObjectURL(file);
  video.src = url;
  video.load();

  video.onloadedmetadata = function(){
    if (!isFinite(video.duration)){
      video.currentTime = 1e101;   // трюк для стримов с неизвестной длительностью
      return;
    }
    settle();
  };
  video.ondurationchange = function(){
    if (isFinite(video.duration) && video.duration > 0) settle();
  };

  var settled = false;
  function settle(){
    if (settled) return;
    if (!isFinite(video.duration) || video.duration <= 0) return;
    settled = true;
    video.onloadedmetadata = null;
    video.ondurationchange = null;

    if (video.duration > MAX_SECONDS + 0.05){
      reject('видео длиннее 20 секунд — выберите другое');
      return;
    }
    start();
  }
}

var started = false;
function start(){
  started = true;
  duration = video.duration;
  loaded = true;
  dropEl.classList.add('hidden');
  dlBtn.disabled = false;
  playBtn.disabled = false;
  seekEl.disabled = false;
  scopeAll.disabled = (fpsMode === 'original');
  scopeFr.disabled = (fpsMode === 'original');

  globalS = blank();
  frameMap = {};
  perFrame = false;
  scopeAll.classList.add('on');
  scopeFr.classList.remove('on');

  layoutStage();
  recomputeFrames();
  paintSliders(globalS);
  updateTimeUI();

  /* Первый кадр может быть ещё не декодирован: drawImage вернул бы пустоту.
     Ждём готовности, иначе на старте видно чёрный прямоугольник. */
  whenFrameReady(function(){ drawPreview(); });
}

function whenFrameReady(cb){
  if (video.readyState >= 2){ cb(); return; }
  var h = function(){
    video.removeEventListener('loadeddata', h);
    cb();
  };
  video.addEventListener('loadeddata', h);
}

function layoutStage(){
  if (!loaded){ stage.style.aspectRatio = '16 / 9'; stage.style.width = ''; stage.style.height=''; return; }
  var ar = video.videoWidth / video.videoHeight;
  var maxW = Math.min(window.innerWidth - 36, 640);
  var maxH = Math.round(window.innerHeight * 0.42);
  var w = maxW, h = w / ar;
  if (h > maxH){ h = maxH; w = h * ar; }
  stage.style.aspectRatio = 'auto';
  stage.style.width = Math.round(w) + 'px';
  stage.style.height = Math.round(h) + 'px';
}

/* ---------- события UI ---------- */
dropEl.addEventListener('click', function(){ fileIn.click(); });
newBtn.addEventListener('click', function(){ fileIn.click(); });
fileIn.addEventListener('change', function(e){
  if (e.target.files && e.target.files[0]){ started = false; loadFile(e.target.files[0]); }
});
stage.addEventListener('dragover', function(e){ e.preventDefault(); });
stage.addEventListener('drop', function(e){
  e.preventDefault();
  var f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f){ started = false; loadFile(f); }
});

playBtn.addEventListener('click', togglePlay);
video.addEventListener('ended', pause);
video.addEventListener('timeupdate', function(){ if (!playing) updateTimeUI(); });

seekEl.addEventListener('input', function(){
  if (!loaded) return;
  seeking = true;
  var t = (parseFloat(seekEl.value)/1000) * duration;
  video.currentTime = t;
});
seekEl.addEventListener('change', function(){ seeking = false; });

video.addEventListener('seeked', function(){
  if (!loaded) return;
  if (perFrame){
    curFrame = frameIndexAt(video.currentTime);
    updateFrameUI();
    paintSliders(settingsFor(curFrame));
  }
  updateTimeUI();
  drawPreview();
});

fpsSel.addEventListener('change', function(){
  fpsMode = fpsSel.value;
  var orig = (fpsMode === 'original');
  scopeAll.disabled = orig;
  scopeFr.disabled = orig;
  if (orig){
    perFrame = false;
    scopeAll.classList.add('on');
    scopeFr.classList.remove('on');
    video.pause();
    playing = false;
    playBtn.textContent = '▶';
    if (rafId) cancelAnimationFrame(rafId);
  }
  frameMap = {};              // индексы кадров меняют смысл — сбрасываем покадровые настройки
  recomputeFrames();
  if (!orig && perFrame){
    video.currentTime = curFrame / parseFloat(fpsMode);
  }
  paintSliders(settingsFor(curFrame));
  drawPreview();
});

scopeAll.addEventListener('click', function(){
  if (fpsMode === 'original') return;
  perFrame = false;
  scopeAll.classList.add('on');
  scopeFr.classList.remove('on');
  frameRow.style.display = 'none';
  paintSliders(globalS);
  drawPreview();
});

scopeFr.addEventListener('click', function(){
  if (fpsMode === 'original') return;
  perFrame = true;
  scopeFr.classList.add('on');
  scopeAll.classList.remove('on');
  pause();
  recomputeFrames();
  video.currentTime = curFrame / parseFloat(fpsMode);
  updateFrameUI();
  paintSliders(settingsFor(curFrame));
});

prevBtn.addEventListener('click', function(){
  if (!perFrame) return;
  curFrame = Math.max(0, curFrame-1);
  video.currentTime = curFrame / parseFloat(fpsMode);
  updateFrameUI();
  paintSliders(settingsFor(curFrame));
});
nextBtn.addEventListener('click', function(){
  if (!perFrame) return;
  curFrame = Math.min(frameCount-1, curFrame+1);
  video.currentTime = curFrame / parseFloat(fpsMode);
  updateFrameUI();
  paintSliders(settingsFor(curFrame));
});
applyBtn.addEventListener('click', function(){
  if (!perFrame) return;
  globalS = clone(settingsFor(curFrame));
  frameMap = {};
  paintSliders(globalS);
  drawPreview();
});

modeBtn.addEventListener('click', function(){
  mode = (mode === 'multiply') ? 'screen' : 'multiply';
  modeBtn.textContent = 'режим: ' + mode;
  drawPreview();
});

htBtn.addEventListener('click', function(){
  halftone = !halftone;
  htBtn.textContent = 'офсет: ' + (halftone ? 'вкл' : 'выкл');
  dotRow.classList.toggle('off', !halftone);
  drawPreview();
});

function cellsFromSlider(v){
  var s = v/100;
  var lo = Math.log(400), hi = Math.log(25);
  return Math.round(Math.exp(lo + s*(hi-lo)));
}
dotSize.addEventListener('input', function(){
  cells = cellsFromSlider(parseFloat(dotSize.value));
  dotVal.textContent = cells;
  drawPreview();
});
cells = cellsFromSlider(parseFloat(dotSize.value));
dotVal.textContent = cells;

resetBtn.addEventListener('click', function(){
  globalS = blank();
  frameMap = {};
  paintSliders(globalS);
  drawPreview();
});

/* ---------- ползунки каналов ---------- */
CH.forEach(function(k){
  ['x','y','rot'].forEach(function(axis){
    var el = document.querySelector('input[data-ch="'+k+'"][data-axis="'+axis+'"]');
    el.addEventListener('input', function(){
      var S = editSettings(curFrame);
      S[k][axis] = parseFloat(el.value);
      document.querySelector('[data-vv="'+k+'-'+axis+'"]').textContent =
        (axis === 'rot') ? (Math.round(S[k][axis]*10)/10)+'°' : Math.round(S[k][axis]);
      setActive(k);
      drawPreview();
    });
    el.addEventListener('pointerdown', function(){ setActive(k); });
    el.addEventListener('focus', function(){ setActive(k); });
  });

  var tg = document.querySelector('[data-tg="'+k+'"]');
  tg.addEventListener('click', function(){
    var S = editSettings(curFrame);
    S[k].on = !S[k].on;
    tg.classList.toggle('on', S[k].on);
    tg.setAttribute('aria-pressed', String(!!S[k].on));
    document.querySelector('.chan[data-ch="'+k+'"]').classList.toggle('off', !S[k].on);
    setActive(k);
    drawPreview();
  });

  document.querySelector('.chan[data-ch="'+k+'"]').addEventListener('pointerdown', function(){ setActive(k); });
});

/* ---------- перетаскивание активного канала ---------- */
var dragging=false, lastX=0, lastY=0;
function pt(e){
  if (e.touches && e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
  return {x:e.clientX, y:e.clientY};
}
function clampV(v){ return Math.max(-SLIDER_MAX, Math.min(SLIDER_MAX, v)); }

function onDown(e){
  if (!loaded) return;
  dragging = true;
  stage.classList.add('dragging');
  var p = pt(e); lastX = p.x; lastY = p.y;
  e.preventDefault();
}
function onMove(e){
  if (!dragging || !loaded) return;
  var p = pt(e);
  var dx = p.x-lastX, dy = p.y-lastY;
  lastX = p.x; lastY = p.y;
  var r = stage.getBoundingClientRect();
  var ref = Math.max(r.width, r.height);   // 1000 «единиц» = длинная сторона
  var S = editSettings(curFrame);
  S[activeCh].x = clampV(S[activeCh].x + dx/ref*1000);
  S[activeCh].y = clampV(S[activeCh].y + dy/ref*1000);
  document.querySelector('input[data-ch="'+activeCh+'"][data-axis="x"]').value = S[activeCh].x;
  document.querySelector('input[data-ch="'+activeCh+'"][data-axis="y"]').value = S[activeCh].y;
  document.querySelector('[data-vv="'+activeCh+'-x"]').textContent = Math.round(S[activeCh].x);
  document.querySelector('[data-vv="'+activeCh+'-y"]').textContent = Math.round(S[activeCh].y);
  drawPreview();
  e.preventDefault();
}
function onUp(){ dragging=false; stage.classList.remove('dragging'); }

stage.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
stage.addEventListener('touchstart', onDown, {passive:false});
window.addEventListener('touchmove', onMove, {passive:false});
window.addEventListener('touchend', onUp);

/* ---------- экспорт ---------- */
function pickMime(){
  var list = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4;codecs=avc1','video/mp4'];
  for (var i=0;i<list.length;i++){
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i];
  }
  return '';
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function seekTo(t){
  return new Promise(function(res){
    var done = false;
    function fin(){ if (done) return; done = true; video.removeEventListener('seeked', fin); res(); }
    video.addEventListener('seeked', fin);
    video.currentTime = Math.min(Math.max(0, t), Math.max(0, duration - 0.001));
    setTimeout(fin, 1200);
  });
}

dlBtn.addEventListener('click', function(){
  if (!loaded) return;
  if (exporting) return;
  if (!window.MediaRecorder || !pickMime()){
    toast('браузер не умеет записывать видео — попробуйте в chrome или сделайте скриншот кадра');
    return;
  }
  exporting = true;

  var wasPlaying = playing;
  pause();
  dlBtn.disabled = true;
  var oldLabel = dlBtn.textContent;
  var orig = (fpsMode === 'original');
  var outFps = orig ? 25 : parseFloat(fpsMode);
  var n = Math.max(1, Math.round(duration * outFps));
  var sz = sizeFor(EXPORT_SIDE);

  var expCanvas = document.createElement('canvas');
  expCanvas.width = sz.w; expCanvas.height = sz.h;
  var expCtx = expCanvas.getContext('2d');

  function labels(i, total){ dlBtn.textContent = i + ' / ' + total; }

  /* --- оригинал: пишем в реальном времени, как играет видео.
         так сохраняется настоящий поток и полная частота кадров --- */
  if (orig){
    var stream0 = expCanvas.captureStream(outFps);
    var mime0 = pickMime();
    var rec0 = new MediaRecorder(stream0, { mimeType: mime0, videoBitsPerSecond: 12000000 });
    var chunks0 = [];
    rec0.ondataavailable = function(e){ if (e.data && e.data.size) chunks0.push(e.data); };
    var stopped0 = new Promise(function(res){ rec0.onstop = res; });

    var offscreen = function(){
      if (video.ended || video.paused) return;
      renderFrameTo(expCtx, expCanvas, sz.w, sz.h, globalS);
      dlBtn.textContent = fmt(video.currentTime) + ' / ' + fmt(duration);
      requestAnimationFrame(offscreen);
    };

    seekTo(0).then(function(){
      rec0.start();
      video.currentTime = 0;
      video.play().catch(function(){});
      requestAnimationFrame(offscreen);
      return new Promise(function(res){
        var onEnd = function(){ video.removeEventListener('ended', onEnd); res(); };
        video.addEventListener('ended', onEnd);
        setTimeout(function(){ video.removeEventListener('ended', onEnd); res(); }, (duration+2)*1000);
      });
    }).then(function(){
      video.pause();
      return sleep(300);
    }).then(function(){
      rec0.stop();
      return stopped0;
    }).then(function(){
      saveBlob(new Blob(chunks0, {type:mime0}), mime0);
    }).catch(function(e){
      toast('не получилось: ' + (e && e.message ? e.message : e));
    }).then(finish);

    function finish(){
      exporting = false;
      dlBtn.disabled = false;
      dlBtn.textContent = oldLabel;
      seekTo(0).then(function(){ drawPreview(); if (wasPlaying) play(); });
    }
    return;
  }

  /* --- 1..15 к/с: покадрово, детерминированно --- */
  var blobs = [];
  function step(){
    var i = 0;
    function next(){
      if (i >= n) return Promise.resolve();
      var t = i / outFps;
      return seekTo(t).then(function(){
        renderFrameTo(expCtx, expCanvas, sz.w, sz.h, settingsFor(perFrame ? frameIndexAt(t) : 0));
        return new Promise(function(res){
          expCanvas.toBlob(function(b){ blobs.push(b); res(); }, 'image/png');
        });
      }).then(function(){
        i++; labels(i, n);
        return next();
      });
    }
    return next();
  }

  step().then(function(){
    var stream = expCanvas.captureStream(0);
    var track = stream.getVideoTracks()[0];
    var mime = pickMime();
    var rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
    var chunks = [];
    rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    var stopped = new Promise(function(res){ rec.onstop = res; });
    rec.start();

    var i2 = 0;
    /* последний кадр держим полный интервал, иначе теряется хвост */
    function push(){
      if (i2 >= blobs.length) return Promise.resolve();
      return createImageBitmap(blobs[i2]).then(function(bmp){
        expCtx.drawImage(bmp, 0, 0);
        if (bmp.close) bmp.close();
        if (track.requestFrame) track.requestFrame();
        i2++; labels(i2, blobs.length);
        return sleep(1000/outFps).then(push);
      });
    }
    return push()
      .then(function(){ return sleep(Math.ceil(1000/outFps) + 150); })
      .then(function(){ rec.stop(); return stopped; })
      .then(function(){ saveBlob(new Blob(chunks, {type:mime}), mime); });
  }).catch(function(e){
    toast('не получилось: ' + (e && e.message ? e.message : e));
  }).then(function(){
    exporting = false;
    dlBtn.disabled = false;
    dlBtn.textContent = oldLabel;
    blobs.length = 0;
    seekTo(0).then(function(){ drawPreview(); if (wasPlaying) play(); });
  });
});

function saveBlob(blob, mime){
  var a = document.createElement('a');
  a.download = 'cmyk-video.' + (mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm');
  a.href = URL.createObjectURL(blob);
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}

var toastT = null;
function toast(msg){
  stage.dataset.msg = msg;
  stage.classList.add('busy');
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function(){ stage.classList.remove('busy'); }, 3200);
}

var exporting = false;

/* ---------- ресайз ---------- */
var rT = null;
window.addEventListener('resize', function(){
  if (rT) clearTimeout(rT);
  rT = setTimeout(function(){ layoutStage(); drawPreview(); }, 150);
});

/* ---------- старт ---------- */
setActive('C');
paintSliders(globalS);

})();
</script>
