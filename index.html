<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>cmyk</title>
<style>
:root{
  --bg:#E6E6E6;
  --fg:#1B1B1F;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg);
  color:var(--fg);
  font-family:'Helvetica Neue', Arial, sans-serif;
  text-transform:lowercase;
  -webkit-tap-highlight-color:transparent;
}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 16px 12px;
}
h1{
  font-size:15px;
  letter-spacing:2px;
  font-weight:700;
  margin-bottom:18px;
  border-bottom:2px solid var(--fg);
  padding-bottom:4px;
}

/* ---------- canvas / dropzone ---------- */
#stage{
  position:relative;
  width:100%;
  max-width:560px;
  border:2px solid var(--fg);
  background:var(--bg);
  aspect-ratio:1/1;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}
#stage.dragging{cursor:grabbing;}
#drop{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:13px;
  letter-spacing:1px;
  padding:20px;
  cursor:pointer;
  border:2px dashed var(--fg);
  z-index:5;
}
#drop.hidden{display:none;}
canvas{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  display:block;
  image-rendering:pixelated;
}
#outCanvas{visibility:hidden;position:absolute;left:-99999px;top:-99999px;}

/* ---------- controls ---------- */
#panel{
  width:100%;
  max-width:560px;
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.row{
  display:flex;
  align-items:center;
  gap:10px;
}
.row label{
  width:70px;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  flex-shrink:0;
}
.row input[type=range]{
  flex:1;
  -webkit-appearance:none;
  appearance:none;
  height:2px;
  background:var(--fg);
  outline:none;
}
.row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;height:16px;
  background:var(--fg);
  border-radius:0;
  cursor:pointer;
}
.row input[type=range]::-moz-range-thumb{
  width:16px;height:16px;
  background:var(--fg);
  border-radius:0;
  border:none;
  cursor:pointer;
}
.row .val{
  width:54px;
  font-size:11px;
  text-align:right;
  flex-shrink:0;
  font-family:monospace;
}

#modeRow{
  display:flex;
  gap:10px;
  align-items:center;
  font-size:11px;
  letter-spacing:1px;
}
#modeRow .hint{opacity:.6;font-size:10px;}

.buttons{
  display:flex;
  gap:10px;
  margin-top:6px;
  flex-wrap:wrap;
}
button{
  flex:1;
  min-width:120px;
  background:var(--fg);
  color:var(--bg);
  border:2px solid var(--fg);
  padding:12px 10px;
  font-size:12px;
  letter-spacing:1px;
  font-weight:700;
  text-transform:lowercase;
  cursor:pointer;
  font-family:inherit;
}
button.secondary{
  background:var(--bg);
  color:var(--fg);
}
button:disabled{
  opacity:.35;
  cursor:default;
}
button:active:not(:disabled){
  opacity:.75;
}

#hint2d{
  font-size:10px;
  opacity:.55;
  text-align:center;
  margin-top:4px;
  letter-spacing:.5px;
}

footer{
  margin-top:auto;
  padding-top:28px;
  padding-bottom:6px;
  font-size:9px;
  opacity:.5;
  letter-spacing:.5px;
}
footer a{
  color:var(--fg);
  text-decoration:none;
  border-bottom:1px solid currentColor;
}

input[type=file]{display:none;}
</style>
</head>
<body>

<h1>cmyk</h1>

<div id="stage">
  <div id="drop">загрузите фото<br>или нажмите сюда</div>
  <canvas id="viewCanvas"></canvas>
</div>
<div id="hint2d">двигайте слой пальцем/мышью по фото — ползунок задаёт сдвиг по x</div>

<input type="file" id="fileInput" accept="image/*">

<div id="panel">

  <div class="row">
    <label for="rC">cyan</label>
    <input type="range" id="rC" min="-200" max="200" value="0" step="1">
    <span class="val" id="vC">0, 0</span>
  </div>

  <div class="row">
    <label for="rM">magenta</label>
    <input type="range" id="rM" min="-200" max="200" value="0" step="1">
    <span class="val" id="vM">0, 0</span>
  </div>

  <div class="row">
    <label for="rY">yellow</label>
    <input type="range" id="rY" min="-200" max="200" value="0" step="1">
    <span class="val" id="vY">0, 0</span>
  </div>

  <div class="row">
    <label for="rK">black</label>
    <input type="range" id="rK" min="-200" max="200" value="0" step="1">
    <span class="val" id="vK">0, 0</span>
  </div>

  <div id="modeRow">
    <span>режим:</span>
    <button class="secondary" id="modeBtn" style="flex:0;min-width:110px;padding:8px 10px;">multiply</button>
    <span class="hint">активный слой для перетаскивания: <b id="activeLayerName">cyan</b></span>
  </div>

  <div class="buttons">
    <button class="secondary" id="resetBtn">сбросить сдвиги</button>
    <button class="secondary" id="newImgBtn">загрузить другое фото</button>
    <button id="downloadBtn" disabled>скачать png</button>
  </div>

</div>

<footer>автор: ot.var — <a href="https://t.me/navarotvar" target="_blank" rel="noopener">https://t.me/navarotvar</a></footer>

<canvas id="outCanvas"></canvas>

<script>
(function(){
  const stage = document.getElementById('stage');
  const dropEl = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const viewCanvas = document.getElementById('viewCanvas');
  const outCanvas = document.getElementById('outCanvas');
  const vctx = viewCanvas.getContext('2d');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');
  const newImgBtn = document.getElementById('newImgBtn');
  const modeBtn = document.getElementById('modeBtn');
  const activeLayerName = document.getElementById('activeLayerName');

  const sliders = {
    C: document.getElementById('rC'),
    M: document.getElementById('rM'),
    Y: document.getElementById('rY'),
    K: document.getElementById('rK'),
  };
  const valLabels = {
    C: document.getElementById('vC'),
    M: document.getElementById('vM'),
    Y: document.getElementById('vY'),
    K: document.getElementById('vK'),
  };

  // offsets in source-image pixel units
  const offsets = {
    C: {x:0,y:0},
    M: {x:0,y:0},
    Y: {x:0,y:0},
    K: {x:0,y:0},
  };

  let mode = 'multiply'; // or 'screen'
  let activeLayer = 'C';
  let srcImg = null;      // HTMLImageElement
  let W = 0, H = 0;       // natural size (capped for preview)
  let fullW = 0, fullH = 0;
  let layerCanvases = null; // {C,M,Y,K} offscreen canvases at full preview res, premultiplied color per mode
  let rafPending = false;

  const MAX_PREVIEW_SIDE = 1400;
  const SLIDER_RANGE = 200; // matches max attr, in "preview px" units approximately

  function setActiveLayer(l){
    activeLayer = l;
    activeLayerName.textContent = {C:'cyan',M:'magenta',Y:'yellow',K:'black'}[l];
    Object.keys(sliders).forEach(k=>{
      sliders[k].parentElement.style.opacity = (k===l)? '1':'0.55';
    });
  }

  // ---------- build CMYK layers from source image ----------
  function buildLayers(img){
    let w = img.naturalWidth, h = img.naturalHeight;
    fullW = w; fullH = h;
    let scale = 1;
    if (Math.max(w,h) > MAX_PREVIEW_SIDE){
      scale = MAX_PREVIEW_SIDE / Math.max(w,h);
    }
    W = Math.max(1, Math.round(w*scale));
    H = Math.max(1, Math.round(h*scale));

    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = W; srcCanvas.height = H;
    const sctx = srcCanvas.getContext('2d');
    sctx.drawImage(img, 0, 0, W, H);
    const imgData = sctx.getImageData(0,0,W,H);
    const data = imgData.data;

    const n = W*H;
    const cData = new Uint8ClampedArray(n*4);
    const mData = new Uint8ClampedArray(n*4);
    const yData = new Uint8ClampedArray(n*4);
    const kData = new Uint8ClampedArray(n*4);

    for (let i=0, p=0; i<n; i++, p+=4){
      const r = data[p], g = data[p+1], b = data[p+2], a = data[p+3];
      const rf = r/255, gf = g/255, bf = b/255;
      const kf = 1 - Math.max(rf,gf,bf);
      let c,m,y;
      if (kf >= 0.9999){ c=0; m=0; y=0; }
      else {
        c = (1-rf-kf)/(1-kf);
        m = (1-gf-kf)/(1-kf);
        y = (1-bf-kf)/(1-kf);
      }

      if (mode === 'multiply'){
        // layer color = white tinted toward the ink; multiply chain reconstructs original
        const cv = 255*(1-c), mv = 255*(1-m), yv = 255*(1-y), kv = 255*(1-kf);
        cData[p]=cv; cData[p+1]=255; cData[p+2]=255; cData[p+3]=a;
        mData[p]=255; mData[p+1]=mv; mData[p+2]=255; mData[p+3]=a;
        yData[p]=255; yData[p+1]=255; yData[p+2]=yv; yData[p+3]=a;
        kData[p]=kv; kData[p+1]=kv; kData[p+2]=kv; kData[p+3]=a;
      } else {
        // screen mode: layer color = pure ink hue at its own intensity; screen chain reconstructs original
        const cv = 255*c, mv = 255*m, yv = 255*y, kv = 255*kf;
        cData[p]=cv; cData[p+1]=0; cData[p+2]=0; cData[p+3]=a;
        mData[p]=0; mData[p+1]=mv; mData[p+2]=0; mData[p+3]=a;
        yData[p]=0; yData[p+1]=0; yData[p+2]=yv; yData[p+3]=a;
        kData[p]=kv; kData[p+1]=kv; kData[p+2]=kv; kData[p+3]=a;
      }
    }

    function toCanvas(arr){
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.putImageData(new ImageData(arr, W, H), 0, 0);
      return c;
    }

    layerCanvases = {
      C: toCanvas(cData),
      M: toCanvas(mData),
      Y: toCanvas(yData),
      K: toCanvas(kData),
    };
  }

  // ---------- render ----------
  function renderTo(ctx, w, h, offScale){
    // background for each mode
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = (mode === 'multiply') ? '#ffffff' : '#000000';
    ctx.fillRect(0,0,w,h);

    const order = ['C','M','Y','K'];
    const blend = (mode === 'multiply') ? 'multiply' : 'screen';

    order.forEach(k=>{
      ctx.globalCompositeOperation = blend;
      const ox = offsets[k].x * offScale;
      const oy = offsets[k].y * offScale;
      ctx.drawImage(layerCanvases[k], ox, oy, w, h);
    });
    ctx.restore();
  }

  function scheduleRender(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(()=>{
      rafPending = false;
      if (!layerCanvases) return;
      viewCanvas.width = W;
      viewCanvas.height = H;
      renderTo(vctx, W, H, 1);
    });
  }

  // ---------- slider <-> offset sync ----------
  function updateLabel(k){
    valLabels[k].textContent = Math.round(offsets[k].x) + ', ' + Math.round(offsets[k].y);
  }

  Object.keys(sliders).forEach(k=>{
    sliders[k].addEventListener('input', ()=>{
      offsets[k].x = parseFloat(sliders[k].value);
      updateLabel(k);
      scheduleRender();
    });
    sliders[k].addEventListener('focus', ()=> setActiveLayer(k));
    sliders[k].addEventListener('pointerdown', ()=> setActiveLayer(k));
  });

  function resetAll(){
    Object.keys(offsets).forEach(k=>{
      offsets[k].x = 0; offsets[k].y = 0;
      sliders[k].value = 0;
      updateLabel(k);
    });
    scheduleRender();
  }
  resetBtn.addEventListener('click', resetAll);

  // ---------- mode toggle ----------
  modeBtn.addEventListener('click', ()=>{
    mode = (mode === 'multiply') ? 'screen' : 'multiply';
    modeBtn.textContent = mode;
    if (srcImg) buildLayers(srcImg);
    scheduleRender();
  });

  // ---------- file loading ----------
  function loadFile(file){
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      srcImg = img;
      buildLayers(img);
      dropEl.classList.add('hidden');
      downloadBtn.disabled = false;
      resetAll();
      scheduleRender();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  dropEl.addEventListener('click', ()=> fileInput.click());
  newImgBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  });

  ['dragover'].forEach(ev=> stage.addEventListener(ev, (e)=>{ e.preventDefault(); }));
  stage.addEventListener('drop', (e)=>{
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  // ---------- drag-to-move active layer on the stage ----------
  let dragging = false;
  let lastX = 0, lastY = 0;

  function pointerPos(e){
    if (e.touches && e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
    return {x:e.clientX, y:e.clientY};
  }

  function onDown(e){
    if (!layerCanvases) return;
    dragging = true;
    stage.classList.add('dragging');
    const p = pointerPos(e);
    lastX = p.x; lastY = p.y;
    e.preventDefault();
  }
  function onMove(e){
    if (!dragging || !layerCanvases) return;
    const p = pointerPos(e);
    const dx = p.x - lastX;
    const dy = p.y - lastY;
    lastX = p.x; lastY = p.y;

    // convert CSS px delta to source-preview-px delta
    const rect = stage.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;

    const k = activeLayer;
    offsets[k].x += dx * scaleX;
    offsets[k].y += dy * scaleY;

    const clamp = v => Math.max(-SLIDER_RANGE, Math.min(SLIDER_RANGE, v));
    offsets[k].x = clamp(offsets[k].x);
    offsets[k].y = clamp(offsets[k].y);

    sliders[k].value = offsets[k].x;
    updateLabel(k);
    scheduleRender();
    e.preventDefault();
  }
  function onUp(){
    dragging = false;
    stage.classList.remove('dragging');
  }

  stage.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  stage.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);

  // ---------- export full-resolution PNG ----------
  downloadBtn.addEventListener('click', ()=>{
    if (!srcImg) return;
    // rebuild layers at full resolution for crisp export
    const prevW = W, prevH = H, prevLayers = layerCanvases;
    const scaleRatio = fullW / W;

    // temporarily build full-res layers
    const tmpMaxSide = Math.max(fullW, fullH);
    const bak = { W, H, layerCanvases };
    W = fullW; H = fullH;
    buildLayers.__skipScaleCap = true;
    buildFullRes(srcImg);

    outCanvas.width = fullW;
    outCanvas.height = fullH;
    const octx = outCanvas.getContext('2d');
    renderTo(octx, fullW, fullH, scaleRatio);

    outCanvas.toBlob((blob)=>{
      const link = document.createElement('a');
      link.download = 'cmyk-glitch.png';
      link.href = URL.createObjectURL(blob);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(()=> URL.revokeObjectURL(link.href), 2000);
    }, 'image/png');

    // restore preview-res layers
    W = bak.W; H = bak.H; layerCanvases = bak.layerCanvases;
    scheduleRender();
  });

  function buildFullRes(img){
    const w = img.naturalWidth, h = img.naturalHeight;
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = w; srcCanvas.height = h;
    const sctx = srcCanvas.getContext('2d');
    sctx.drawImage(img, 0, 0, w, h);
    const imgData = sctx.getImageData(0,0,w,h);
    const data = imgData.data;

    const n = w*h;
    const cData = new Uint8ClampedArray(n*4);
    const mData = new Uint8ClampedArray(n*4);
    const yData = new Uint8ClampedArray(n*4);
    const kData = new Uint8ClampedArray(n*4);

    for (let i=0, p=0; i<n; i++, p+=4){
      const r = data[p], g = data[p+1], b = data[p+2], a = data[p+3];
      const rf = r/255, gf = g/255, bf = b/255;
      const kf = 1 - Math.max(rf,gf,bf);
      let c,m,y;
      if (kf >= 0.9999){ c=0; m=0; y=0; }
      else {
        c = (1-rf-kf)/(1-kf);
        m = (1-gf-kf)/(1-kf);
        y = (1-bf-kf)/(1-kf);
      }
      if (mode === 'multiply'){
        const cv = 255*(1-c), mv = 255*(1-m), yv = 255*(1-y), kv = 255*(1-kf);
        cData[p]=cv; cData[p+1]=255; cData[p+2]=255; cData[p+3]=a;
        mData[p]=255; mData[p+1]=mv; mData[p+2]=255; mData[p+3]=a;
        yData[p]=255; yData[p+1]=255; yData[p+2]=yv; yData[p+3]=a;
        kData[p]=kv; kData[p+1]=kv; kData[p+2]=kv; kData[p+3]=a;
      } else {
        const cv = 255*c, mv = 255*m, yv = 255*y, kv = 255*kf;
        cData[p]=cv; cData[p+1]=0; cData[p+2]=0; cData[p+3]=a;
        mData[p]=0; mData[p+1]=mv; mData[p+2]=0; mData[p+3]=a;
        yData[p]=0; yData[p+1]=0; yData[p+2]=yv; yData[p+3]=a;
        kData[p]=kv; kData[p+1]=kv; kData[p+2]=kv; kData[p+3]=a;
      }
    }
    function toCanvas(arr){
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.putImageData(new ImageData(arr, w, h), 0, 0);
      return c;
    }
    layerCanvases = {
      C: toCanvas(cData), M: toCanvas(mData), Y: toCanvas(yData), K: toCanvas(kData),
    };
  }

  setActiveLayer('C');
})();
</script>
</body>
</html>
